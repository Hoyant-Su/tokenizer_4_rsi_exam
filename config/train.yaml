seed: 42
training:
  batch_size: 8
  context_length: 4096
  epochs: 1
  learning_rate: 0.0003
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0.01
  clip_grad_norm: 1.0
  fused_optimizer: false
  checkpoint_interval: 256
  log_every: 16
  max_checkpoint_num: 2
  resume_path: null
  loss_mask: target_mask
evaluation:
  records:
    mode:
      test: jsonl
    file: test_records.jsonl
  progress:
    mode: fresh
    state_file: test_progress.json
    interval_batches: 256
  groupings:
  - dataset
  - source
  batch_size: 8
  checkpoint_index: artifacts/model/checkpoint.json
world_size: 1
optimizer:
  muon:
    module_boundaries:
    - model.layers.*.self_attn
    - model.layers.*.mlp
    momentum: 0.95
    nesterov: true
    ns_steps: 5
  parameter_learning_rate_multiplier: 1.0
schedule:
  mode: warmup_cosine
  warmup_fraction: 0.03
  end_factor: 0.1
model:
  hidden_size: 512
  intermediate_size: 1536
  num_hidden_layers: 8
  num_attention_heads: 8
  num_key_value_heads: 8
  max_position_embeddings: 4096
  rope_theta: 10000.0
  rope_scaling: null
  attention_dropout: 0.0
  rms_norm_eps: 1.0e-06
  initializer_range: 0.02
  tie_word_embeddings: true
  hidden_act: silu
  use_cache: false
  _attn_implementation: sdpa
  attention_bias: false
  mlp_bias: false
  pretraining_tp: 1
  head_dim: 64
architecture:
  config_class: LlamaConfig
  model_class: LlamaForCausalLM
embedding_initialization:
  mode: literal_seeded
  structural_symbols: []
batching:
  mode: length_bucketed
  sequence_fields:
  - input_ids
  - target_ids
  - attention_mask
  - target_mask
  - content_mask
tokenizer:
  backend: configured
  lexical_config: config/bpe.yaml
  decode_errors: strict
  path: artifacts/tokenizer/tokenizer.json
  encode_special_tokens: false
  pad_id: 0
  bos_id: 1
  eos_id: 2
storage:
  encoder:
    module: data.language_model.storage
    function: process_encoder
  splits:
  - train
  - test
  token_dtype: <u4
  window_dtype: <u8
  record_dtype:
  - - token_start
    - <u8
  - - token_count
    - <u8
  - - utf8_bytes
    - <u8
  - - dataset
    - <u4
  - - source
    - <u4
  - - source_row
    - <u8
  - - identity_start
    - <u8
  - - identity_bytes
    - <u4
  batch_rows: 4096
  batch_bytes: 16777216
  json_indent: 2
  paths_by_split:
    train:
      tokens: artifacts/tokens/train/tokens.bin
      records: artifacts/tokens/train/records.bin
      windows: artifacts/tokens/train/windows.bin
      identities: artifacts/tokens/train/identities.jsonl
      summary: artifacts/tokens/train/summary.json
    test:
      tokens: artifacts/tokens/test/tokens.bin
      records: artifacts/tokens/test/records.bin
      windows: artifacts/tokens/test/windows.bin
      identities: artifacts/tokens/test/identities.jsonl
      summary: artifacts/tokens/test/summary.json
  record_encoders:
    train:
      module: data.language_model.encoding
      function: encode_record
    test:
      module: data.language_model.encoding
      function: encode_record
workflow:
  module: train.language_model.workflow
  entry: run
preparation:
  cpu_workers: 8
  worker_threads: 1
  process_start: spawn
  chunksize: 1
shared_config: null
reading:
  format: parquet
  batch_rows: 128
  use_threads: false
  paths_by_split:
    train:
    - data/corpus/train/moleculenet_esol.parquet
    - data/corpus/train/ds1000.parquet
    - data/corpus/train/moleculenet_lipophilicity.parquet
    - data/corpus/train/moleculenet_freesolv.parquet
    - data/corpus/train/spider.parquet
    - data/corpus/train/webnlg_2017.parquet
    - data/corpus/train/matbench_expt_gap.parquet
    - data/corpus/train/ucr_ecg5000.parquet
    - data/corpus/train/pfam32_seed.parquet
    - data/corpus/train/genomic_benchmarks_human_ensembl_regulatory.parquet
    - data/corpus/train/ddxplus.parquet
    - data/corpus/train/im2latex_100k.parquet
    - data/corpus/train/leandojo_benchmark_4.parquet
    - data/corpus/train/codexglue_code_refinement_buggy.parquet
    - data/corpus/train/codexglue_code_refinement_fixed.parquet
    test:
    - data/corpus/test/moleculenet_esol.parquet
    - data/corpus/test/ds1000.parquet
    - data/corpus/test/moleculenet_lipophilicity.parquet
    - data/corpus/test/moleculenet_freesolv.parquet
    - data/corpus/test/spider.parquet
    - data/corpus/test/webnlg_2017.parquet
    - data/corpus/test/matbench_expt_gap.parquet
    - data/corpus/test/ucr_ecg5000.parquet
    - data/corpus/test/pfam32_seed.parquet
    - data/corpus/test/genomic_benchmarks_human_ensembl_regulatory.parquet
    - data/corpus/test/ddxplus.parquet
    - data/corpus/test/im2latex_100k.parquet
    - data/corpus/test/leandojo_benchmark_4.parquet
    - data/corpus/test/codexglue_code_refinement_buggy.parquet
    - data/corpus/test/codexglue_code_refinement_fixed.parquet
corpus:
  storage: mmap
  mode: next_token
  train_split: train
  test_split: test
execution:
  device: cuda:0
  device_type: cuda
  dtype: bfloat16
  autocast: true
  num_threads: 8
  num_workers: 0
  pin_memory: true
  deterministic_algorithms: true
  cublas_workspace_config: :4096:8
  matmul_precision: highest
  cudnn_benchmark: false
  allow_tf32: false
  environment:
    OMP_NUM_THREADS: '8'
    MKL_NUM_THREADS: '8'
    TOKENIZERS_PARALLELISM: 'false'
    RAYON_NUM_THREADS: '1'
    TORCHINDUCTOR_CACHE_DIR: artifacts/runtime/torchinductor
output:
  root: artifacts/model
  checkpoint_root: checkpoints
  record_selection_details: false
